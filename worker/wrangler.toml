# Configuração do servidor de pagamentos (Cloudflare Worker "popzin-api").
# Publicado automaticamente pelo Cloudflare Workers Builds a cada push neste repositório.
# Os segredos (MP_ACCESS_TOKEN, FIREBASE_SA e RESEND_API_KEY) ficam só no painel do Cloudflare, nunca aqui.
name = "popzin-api"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
FIREBASE_PROJECT = "popzin"
ORIGENS = "https://popzin.com.br,https://www.popzin.com.br,https://viniverk.github.io"
SITE_URL = "https://popzin.com.br"
EMAIL_DE = "PopZin <pedidos@popzin.com.br>"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
